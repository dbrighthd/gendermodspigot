name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload release JAR
        if: matrix.java == 21 && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: Female-Gender-Mod-Plugin-${{ github.sha }}
          path: target/Female-Gender-Mod-Plugin-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release JAR
        uses: actions/download-artifact@v7
        with:
          name: Female-Gender-Mod-Plugin-${{ github.sha }}
          path: release

      - name: Verify tag matches project version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          expected="release/Female-Gender-Mod-Plugin-${version}.jar"
          if [[ ! -f "$expected" ]]; then
            echo "::error title=Tag/version mismatch::Expected $expected for tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.jar
          generate_release_notes: true
